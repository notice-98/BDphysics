<svg xmlns="http://www.w3.org/2000/svg" width="384" height="416" viewBox="64 64 384 416" role="img" aria-labelledby="bdp-title bdp-desc">
  <title id="bdp-title">BDP Fold</title>
  <desc id="bdp-desc">B, D and P are the structure of an open isometric cube. Three interlocking angular letterforms leave large negative spaces and an open seam, suggesting unfolding geometry and motion. All lettering is editable vector paths. Transparent background.</desc>
  <!-- The three letterforms form the volume itself; there are no cube-face plates. -->
<g fill-rule="evenodd">
<path id="p-top-fold" fill="#65DD9D" transform="matrix(1.72 -1 1.72 1 84 156)" d="M0 0H73L100 27V60L80 80H31V100H0Z M31 23V53H64L75 42V34L64 23Z"/>
<path id="b-left-fold" fill="#F4767A" transform="matrix(1.72 1 0 2 84 156)" d="M0 0H70L100 24V43L84 51L100 67V84L80 100H0Z M27 24H54L71 35V39L62 44H27Z M27 61H58L72 70V76L62 81H27Z"/>
<path id="d-right-fold" fill="#6BA4F6" transform="matrix(1.72 -1 0 2 256 256)" d="M0 0H71L100 28V75L75 100H0Z M29 24V76H59L74 61V39L59 24Z"/>
</g>
</svg>
